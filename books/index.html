<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <style>
        .purchase-links { position: relative; display: inline-block; margin-top: 1em; }
        .retailer-menu { display: none; position: absolute; background: white; list-style: none; padding: 0.5em 0; margin: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); min-width: 200px; z-index: 100; }
        .retailer-menu.show { display: block; }
        .retailer-menu li { padding: 0; }
        .retailer-menu a { display: block; padding: 0.5em 1em; color: inherit; text-decoration: none; }
        .retailer-menu a:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="book-info">
        <h2>Fabemol</h2>
        <div class="purchase-links">
            <button onclick="togglePurchaseLinks()" class="btn">Purchase</button>
            <ul id="retailer-links" class="retailer-menu">
                <li><a href="https://www.amazon.com/Fabemol-Hears-Heart-Listening-Empathy/dp/B0FM9L29NZ/ref=sr_1_3?crid=VFVAJ60DCQNF&dib=eyJ2IjoiMSJ9.phf1waRThDF__dzNFUI9ltPsm4wz0O3UIG6mn2dVXC8.yL5J2x9ZTC89Ilelmo69WVj908HxjPeMtafDrIItw4g&dib_tag=se&keywords=fabemol&qid=1759664566&sprefix=fabemol%2Caps%2C99&sr=8-3" target="_blank">Amazon</a></li>
                <li><a href="https://www.barnesandnoble.com/w/fabemol-hears-the-heart-mary-ann-domanska/1148042595" target="_blank">Barnes & Noble</a></li>
                <li><a href="https://bookshop.org/p/books/fabemol-hears-the-heart-a-story-about-listening-and-empathy/6616788c7fc475c5?ean=9798992504057&next=t" target="_blank">Bookshop.org</a></li>
                <li><a href="https://www.strandbooks.com/fabemol-hears-the-heart-a-story-about-listening-and-empathy-9798992504057.html" target="_blank">Strand Books</a></li>
            </ul>
        </div>
    </div>
    <script>
        function togglePurchaseLinks() {
            const menu = document.getElementById('retailer-links');
            menu.classList.toggle('show');
            
            // Close menu when clicking outside
            document.addEventListener('click', function closeMenu(e) {
                if (!e.target.closest('.purchase-links')) {
                    menu.classList.remove('show');
                    document.removeEventListener('click', closeMenu);
                }
            });
        }
    </script>
</body>
</html>
